<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>래더 회로 시뮬레이터</title>

<style>
body {
  background:#ddd;
  text-align:center;
}

.board {
  position:relative;
  width:700px;
  height:400px;
  margin:50px auto;
}

.top, .bottom {
  position:absolute;
  width:100%;
  height:2px;
  background:black;
}
.top { top:50px; }
.bottom { bottom:50px; }

/* 왼쪽 전원선 */
.line {
  position:absolute;
  width:2px;
  height:300px;
  background:black;
  top:50px;
  left:100px;
}

/* 오른쪽 고정 접점 */
.fixed-line {
  position:absolute;
  width:2px;
  height:80px;
  background:black;
  top:90px;
  left:200px;
}

/* ===== 스위치 영역 ===== */
.switch {
  position:absolute;
  top:90px;
  left:150px;
  width:60px;
  height:120px;
  cursor:pointer;
}

/* 🔥 움직이는 세로 접점 */
.moving-contact {
  position:absolute;
  width:2px;
  height:80px;
  background:black;
  left:20px;
  transition:0.3s;
}

/* 🔥 동그라미 */
.circle {
  position:absolute;
  width:12px;
  height:12px;
  border:2px solid black;
  border-radius:50%;
  background:#ddd;
  left:14px;
}

.circle.top {
  top:0;
}

.circle.bottom {
  bottom:0;
}

/* 🔥 가운데 가로선 */
.contact-h {
  position:absolute;
  width:20px;
  height:2px;
  background:black;
  top:50%;
  left:20px;
}

/* 🔥 ON 상태 → 왼쪽으로 붙음 */
.switch.on .moving-contact {
  left:48px; /* 고정선까지 이동 */
}

/* ===== 램프 ===== */
.lamp {
  position:absolute;
  top:220px;
  left:120px;
  width:60px;
  height:40px;
  border-radius:20px;
  border:2px solid black;
  background:white;
}

.lamp.on {
  background:yellow;
  box-shadow:0 0 20px yellow;
}
</style>

</head>
<body>

<h2>래더 회로 시뮬레이터</h2>

<div class="board">

  <div class="top"></div>
  <div class="bottom"></div>

  <!-- 왼쪽 전원 -->
  <div class="line"></div>

  <!-- 오른쪽 고정 접점 -->
  <div class="fixed-line"></div>

  <!-- 🔥 스위치 -->
  <div class="switch" onclick="toggle(0)" id="sw0">

    <div class="moving-contact"></div>

    <div class="circle top"></div>
    <div class="circle bottom"></div>

    <div class="contact-h"></div>

  </div>

  <!-- 램프 -->
  <div class="lamp" id="lamp0"></div>

</div>

<script>
let state = [false];

function toggle(i){
  state[i] = !state[i];

  let lamp = document.getElementById("lamp"+i);
  let sw = document.getElementById("sw"+i);

  if(state[i]){
    lamp.classList.add("on");
    sw.classList.add("on");
  } else {
    lamp.classList.remove("on");
    sw.classList.remove("on");
  }
}
</script>

</body>
</html>
