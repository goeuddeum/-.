<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>래더 회로 시뮬레이터</title>

<style>
body {
  background:#ddd;
  text-align:center;
}

.board {
  position:relative;
  width:700px;
  height:400px;
  margin:50px auto;
}

.top, .bottom {
  position:absolute;
  width:100%;
  height:2px;
  background:black;
}
.top { top:50px; }
.bottom { bottom:50px; }

/* 선 */
.line {
  position:absolute;
  width:2px;
  height:300px;
  background:black;
  top:50px;
}

/* 고정 접점 */
.fixed {
  position:absolute;
  top:90px;
  width:2px;
  height:40px;
  background:black;
}

/* 스위치 */
.switch {
  position:absolute;
  top:90px;
  width:40px;
  height:40px;
  cursor:pointer;
}

/* 세로선 */
.contact-v {
  position:absolute;
  width:2px;
  height:40px;
  background:black;
  left:20px;
}

/* 🔥 진짜 ㅏ 모양 (중앙에서 튀어나옴) */
.contact-h {
  position:absolute;
  width:18px;              /* 조금 더 길게 */
  height:2px;
  background:black;
  top:50%;
  left:20px;               /* 세로선 기준 오른쪽으로 */
  transform:translateY(-50%);
}
/* 이동 */
.switch.on {
  transform: translateX(-18px);
  transition:0.3s;
}

/* 램프 */
.lamp {
  position:absolute;
  top:220px;
  width:40px;
  height:40px;
  border-radius:50%;
  border:2px solid black;
  background:white;
}

.lamp.on {
  background:yellow;
  box-shadow:0 0 15px yellow;
}
</style>

</head>
<body>

<h2>래더 회로 시뮬레이터</h2>

<div class="board">

  <div class="top"></div>
  <div class="bottom"></div>

  <!-- 1 -->
  <div class="line" style="left:100px;"></div>

  <div class="fixed" style="left:100px;"></div>

  <div class="switch" style="left:120px;" onclick="toggle(0)" id="sw0">
    <div class="contact-v"></div>
    <div class="contact-h"></div>
  </div>

  <div class="lamp" id="lamp0" style="left:80px;"></div>

</div>

<script>
let state = [false];

function toggle(i){
  state[i] = !state[i];

  let lamp = document.getElementById("lamp"+i);
  let sw = document.getElementById("sw"+i);

  if(state[i]){
    lamp.classList.add("on");
    sw.classList.add("on");
  } else {
    lamp.classList.remove("on");
    sw.classList.remove("on");
  }
}
</script>

</body>
</html>
